<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><link rel="icon" href="/FavIcon.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#0A1628;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:transparent;color:var(--t2);padding:24px;min-height:100%}
.page-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--t3);margin-bottom:24px}
.panel{background:rgba(26,37,84,0.55);border:1px solid rgba(123,92,255,0.2);border-radius:16px;padding:20px;margin-bottom:16px;max-width:720px}
.panel h2{font-size:15px;color:#fff;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(123,92,255,0.25);background:rgba(15,28,63,0.7);color:#fff;font-family:inherit;font-size:14px}
.btn{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-ghost{background:rgba(123,92,255,0.1);border:1px solid rgba(123,92,255,0.3);color:var(--p3)}
.btn-danger{background:rgba(255,75,110,0.12);border:1px solid rgba(255,75,110,0.3);color:var(--red)}
.msg{margin-top:10px;font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;padding:8px 6px}
td{padding:12px 6px;border-top:1px solid rgba(123,92,255,0.1)}
.empty{color:var(--t3);font-size:14px;padding:12px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
</style></head>
<body>
<div class="page-title">Mon Cercle d’aide</div>
<p class="page-sub">Ton lien de partage et les personnes de tes 3 cercles.</p>
<div class="panel"><h2>Ton lien de partage</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="lien" readonly style="flex:1"><button class="btn btn-ghost" type="button" onclick="navigator.clipboard.writeText(document.getElementById('lien').value)">Copier</button></div>
</div>
<div class="panel"><h2>Ton PayPal</h2>
  <input id="paypal" placeholder="ton@paypal.com"><button class="btn" type="button" onclick="savePaypal()">Enregistrer</button><div class="msg" id="pp-msg"></div>
</div>
<div class="panel"><h2>Tes cercles</h2><div id="cercles" class="empty">Chargement…</div></div>
<script>

var TOKEN_KEY='nyxia_cercle_token';
var token=sessionStorage.getItem(TOKEN_KEY);
if(!token){ parent.location.href='/login.html'; }
async function api(path,method,body){
  var o={method:method||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':token}};
  if(body) o.body=JSON.stringify(body);
  var r=await fetch(path,o);
  var d=await r.json();
  if(r.status===401){ parent.location.href='/login.html'; throw new Error('Session'); }
  return d;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}

async function load(){
  var d=await api('/api/dashboard','POST',{});
  if(d.lienPartage) document.getElementById('lien').value=d.lienPartage;
  if(d.profil) document.getElementById('paypal').value=d.profil.paypal||'';
  var c=d.cercle||{direct:[],deuxieme:[],troisieme:[]};
  function block(t,rows){
    if(!rows||!rows.length) return '<p class="empty">'+t+' : personne pour le moment.</p>';
    return '<p style="color:#fff;font-weight:600;margin:12px 0 6px">'+t+' ('+rows.length+')</p><table><tr><th>Prénom</th><th>Depuis</th></tr>'+rows.map(function(m){return '<tr><td>'+esc(m.prenom)+'</td><td>'+esc((m.depuis||'').slice(0,10))+'</td></tr>';}).join('')+'</table>';
  }
  document.getElementById('cercles').innerHTML=block('Cercle direct',c.direct)+block('2ᵉ cercle',c.deuxieme)+block('3ᵉ cercle',c.troisieme);
}
async function savePaypal(){
  var d=await api('/api/paypal','POST',{paypal:document.getElementById('paypal').value.trim()});
  var m=document.getElementById('pp-msg'); m.className='msg '+(d.success?'ok':'err'); m.textContent=d.success?'Enregistré.':(d.error||'Erreur');
}
load();
</script>
</body></html>
