<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><link rel="icon" href="/FavIcon.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#0A1628;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:transparent;color:var(--t2);padding:24px;min-height:100%}
.page-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--t3);margin-bottom:24px}
.panel{background:rgba(26,37,84,0.55);border:1px solid rgba(123,92,255,0.2);border-radius:16px;padding:20px;margin-bottom:16px;max-width:720px}
.panel h2{font-size:15px;color:#fff;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(123,92,255,0.25);background:rgba(15,28,63,0.7);color:#fff;font-family:inherit;font-size:14px}
.btn{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-ghost{background:rgba(123,92,255,0.1);border:1px solid rgba(123,92,255,0.3);color:var(--p3)}
.btn-danger{background:rgba(255,75,110,0.12);border:1px solid rgba(255,75,110,0.3);color:var(--red)}
.msg{margin-top:10px;font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;padding:8px 6px}
td{padding:12px 6px;border-top:1px solid rgba(123,92,255,0.1)}
.empty{color:var(--t3);font-size:14px;padding:12px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
</style></head>
<body>
<div class="page-title">Produits</div>
<p class="page-sub">Crée un produit visible sur le Répertoire, puis gère-le ici.</p>
<div class="panel">
  <h2>Créer un produit → visible sur le Répertoire</h2>
  <label>Titre</label><input id="title" placeholder="Nom du produit">
  <label>Description</label><input id="desc" placeholder="Courte description">
  <label>Prix</label><input id="price" type="number" step="0.01" placeholder="0">
  <label>Lien d’offre</label><input id="link" placeholder="https://...">
  <label>Image (URL)</label><input id="img" placeholder="https://...">
  <button class="btn" type="button" onclick="createProduct()">Publier sur le Répertoire</button>
  <div class="msg" id="pr-msg"></div>
</div>
<div class="panel"><h2>Mes produits</h2><div id="list" class="empty">Chargement…</div></div>
<script>

var TOKEN_KEY='nyxia_cercle_token';
var token=sessionStorage.getItem(TOKEN_KEY);
if(!token){ parent.location.href='/login.html'; }
async function api(path,method,body){
  var o={method:method||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':token}};
  if(body) o.body=JSON.stringify(body);
  var r=await fetch(path,o);
  var d=await r.json();
  if(r.status===401){ parent.location.href='/login.html'; throw new Error('Session'); }
  return d;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}

async function createProduct(){
  var d=await api('/api/admin/products','POST',{title:document.getElementById('title').value.trim(),description:document.getElementById('desc').value.trim(),price:document.getElementById('price').value,affiliateLink:document.getElementById('link').value.trim(),imageUrl:document.getElementById('img').value.trim()});
  var m=document.getElementById('pr-msg'); m.className='msg '+(d.success?'ok':'err'); m.textContent=d.success?'Produit publié.':(d.error||'Erreur');
  if(d.success){ document.getElementById('title').value=''; loadProducts(); }
}
async function setStatus(id,status){ var d=await api('/api/admin/products/status','POST',{id:id,status:status}); if(d.success) loadProducts(); else alert(d.error||'Erreur'); }
async function delProduct(id){ if(!confirm('Supprimer ?')) return; var d=await api('/api/admin/products/delete','POST',{id:id}); if(d.success) loadProducts(); }
async function loadProducts(){
  var d=await api('/api/admin/products','GET'); var list=d.products||[]; var el=document.getElementById('list');
  if(!list.length){ el.innerHTML='<p class="empty">Aucun produit.</p>'; return; }
  el.innerHTML='<table><tr><th>Titre</th><th>Prix</th><th>Statut</th><th>Actions</th></tr>'+list.map(function(p){
    return '<tr><td>'+esc(p.title)+'</td><td>'+esc(p.price)+'</td><td>'+esc(p.status)+'</td><td class="actions">'
      +(p.status!=='active'?'<button class="btn btn-ghost" type="button" onclick="setStatus(\''+p.id+'\',\'active\')">Activer</button>':'')
      +(p.status!=='draft'?'<button class="btn btn-ghost" type="button" onclick="setStatus(\''+p.id+'\',\'draft\')">Pause</button>':'')
      +'<button class="btn btn-danger" type="button" onclick="delProduct(\''+p.id+'\')">Supprimer</button></td></tr>';
  }).join('')+'</table>';
}
loadProducts();
</script>
</body></html>
