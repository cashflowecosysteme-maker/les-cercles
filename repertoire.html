<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Répertoire · NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0F1C3F;--p:#7B5CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg1);color:var(--t2);min-height:100vh}
canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px}
h1{font-family:Space Grotesk,sans-serif;font-size:28px;color:#fff;margin-bottom:8px}
.sub{color:var(--t3);margin-bottom:28px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:rgba(26,37,84,.55);border:1px solid rgba(123,92,255,.2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card img{width:100%;height:140px;object-fit:cover;border-radius:12px}
.card h3{color:#fff;font-size:16px}
.card p{font-size:13px;color:var(--t3);flex:1}
.card .price{color:var(--p3);font-weight:700}
.card a{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,#7B5CFF,#5A6CFF);color:#fff;text-decoration:none;font-size:13px;font-weight:700;text-align:center}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="wrap">
  <h1>Le Répertoire</h1>
  <p class="sub">Produits et offres partagés par les Admin et le SuperAdmin</p>
  <div class="grid" id="grid">Chargement…</div>
</div>
<script src="/starry-bg.js" defer></script>
<script>
fetch('/api/public/marketplace').then(function(r){return r.json();}).then(function(d){
  var list=d.products||[];
  var g=document.getElementById('grid');
  if(!list.length){g.textContent='Aucun produit publié pour le moment.';return;}
  g.innerHTML=list.map(function(p){
    var img=p.image_url?'<img src="'+p.image_url+'" alt="">':'';
    var link=p.affiliate_link?'<a href="'+p.affiliate_link+'" target="_blank" rel="noopener">Voir l’offre</a>':'';
    return '<div class="card">'+img+'<h3>'+esc(p.title)+'</h3><p>'+esc(p.description_short||'')+'</p><div class="price">'+esc(p.price)+' $</div>'+link+'</div>';
  }).join('');
}).catch(function(){document.getElementById('grid').textContent='Impossible de charger le répertoire.';});
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
</script>
</body>
</html>
