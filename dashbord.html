<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/FavIcon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Cercles · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #0A1628; --bg2: #0F1C3F; --sidebar: #080f22;
  --p: #7B5CFF; --p2: #5A6CFF; --p3: #4FA3FF;
  --t: #FFFFFF; --t2: #D6D9F0; --t3: #8891B8; --t4: #4a5278;
  --green: #00E676; --gold: #F4C842; --red: #FF4B6E;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg1); color: var(--t2); font-family: 'Outfit', sans-serif; display: flex; flex-direction: column; }
#starry-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
header {
  position: relative; z-index: 100; height: 56px;
  background: rgba(8,15,34,0.95); border-bottom: 1px solid rgba(123,92,255,0.12);
  backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 0 0; flex-shrink: 0;
}
.header-brand { width: 260px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-right: 1px solid rgba(123,92,255,0.1); height: 100%; }
.header-brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(123,92,255,0.5); box-shadow: 0 0 20px rgba(123,92,255,0.4); }
.brand-name { font-size: 15px; font-weight: 700; background: linear-gradient(135deg, #a78bfa, var(--p3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand-status { font-size: 11px; color: var(--green); }
.header-center { flex: 1; display: flex; align-items: center; justify-content: center; }
.welcome-text { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; color: var(--t3); }
.welcome-text strong { color: var(--gold); font-style: normal; font-weight: 600; }
.header-actions { padding-right: 16px; }
.btn-header { padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(123,92,255,0.25); background: rgba(123,92,255,0.1); color: var(--t2); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.app-body { flex: 1; display: flex; min-height: 0; position: relative; z-index: 1; }
aside {
  width: 260px; flex-shrink: 0; background: var(--sidebar);
  border-right: 1px solid rgba(123,92,255,0.1);
  display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto;
}
.nav-section { font-size: 10px; font-weight: 700; color: var(--t4); text-transform: uppercase; letter-spacing: .08em; margin: 14px 8px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
  cursor: pointer; color: var(--t2); margin-bottom: 4px; border: 1px solid transparent;
  background: transparent; width: 100%; text-align: left; font-family: inherit;
}
.nav-item:hover { background: rgba(123,92,255,0.08); }
.nav-item.active { background: rgba(123,92,255,0.15); border-color: rgba(123,92,255,0.25); color: #fff; }
.nav-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(123,92,255,0.35); }
.nav-icon { font-size: 18px; width: 32px; text-align: center; }
.nav-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.nav-name { font-size: 13px; font-weight: 600; }
.nav-sub { font-size: 11px; color: var(--t3); }
.nav-arrow { margin-left: auto; font-size: 12px; color: var(--t4); }
main { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: transparent; }
#content-frame { border: 0; width: 100%; height: 100%; flex: 1; background: transparent; }
@media (max-width: 900px) {
  aside { display: none; }
  .header-brand { width: auto; border: none; }
}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<header>
  <div class="header-brand">
    <img src="/NyXia.png" alt="NyXia">
    <div>
      <div class="brand-name">Les Cercles</div>
      <div class="brand-status">Espace Admin</div>
    </div>
  </div>
  <div class="header-center">
    <div class="welcome-text">Bonjour <strong id="prenom">—</strong></div>
  </div>
  <div class="header-actions">
    <button class="btn-header" type="button" onclick="logout()">Déconnexion</button>
  </div>
</header>
<div class="app-body">
  <aside>
    <div class="nav-section">Mon espace</div>
    <button type="button" class="nav-item active" data-page="chat-diane.html" id="nav-diane" onclick="openPage('chat-diane.html','nav-diane')">
      <img class="nav-avatar" src="/Diane.png" alt="Diane">
      <span class="nav-text"><span class="nav-name">Diane</span><span class="nav-sub">Formatrice</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <button type="button" class="nav-item" data-page="chat-nyxia.html" id="nav-nyxia" onclick="openPage('chat-nyxia.html','nav-nyxia')">
      <img class="nav-avatar" src="/NyXia.png" alt="NyXia">
      <span class="nav-text"><span class="nav-name">NyXia</span><span class="nav-sub">Assistante Général</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <button type="button" class="nav-item" data-page="chat-eric.html" id="nav-eric" onclick="openPage('chat-eric.html','nav-eric')">
      <img class="nav-avatar" src="/Eric.png" alt="Éric">
      <span class="nav-text"><span class="nav-name">Éric</span><span class="nav-sub">Assistant de Communication</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <div class="nav-section">Gestion</div>
    <button type="button" class="nav-item" data-page="panel-produits.html" id="nav-produits" onclick="openPage('panel-produits.html','nav-produits')">
      <span class="nav-icon">📦</span>
      <span class="nav-text"><span class="nav-name">Produits</span><span class="nav-sub">Créer et gérer</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <button type="button" class="nav-item" data-page="panel-cercle.html" id="nav-cercle" onclick="openPage('panel-cercle.html','nav-cercle')">
      <span class="nav-icon">🔗</span>
      <span class="nav-text"><span class="nav-name">Mon Cercle d’aide</span><span class="nav-sub">Lien et équipe</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <button type="button" class="nav-item" data-page="panel-messages.html" id="nav-messages" onclick="openPage('panel-messages.html','nav-messages')">
      <span class="nav-icon">💬</span>
      <span class="nav-text"><span class="nav-name">Messages</span><span class="nav-sub">SuperAdmin et cercle</span></span>
      <span class="nav-arrow">›</span>
    </button>
    <button type="button" class="nav-item" data-page="panel-outils.html" id="nav-outils" onclick="openPage('panel-outils.html','nav-outils')">
      <span class="nav-icon">🛠️</span>
      <span class="nav-text"><span class="nav-name">Outils</span><span class="nav-sub">Bientôt disponible</span></span>
      <span class="nav-arrow">›</span>
    </button>
  </aside>
  <main>
    <iframe id="content-frame" src="/chat-diane.html" title="Contenu" allow="clipboard-write; autoplay"></iframe>
  </main>
</div>
<script src="/starry-bg.js" defer></script>
<script>
var TOKEN_KEY = 'nyxia_cercle_token';
var token = sessionStorage.getItem(TOKEN_KEY);
if (!token) location.href = '/login.html';

function logout() {
  try {
    fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Cercle-Token': token }, body: '{}' });
  } catch (e) {}
  sessionStorage.removeItem(TOKEN_KEY);
  location.href = '/login.html';
}

function openPage(page, navId) {
  document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
  var el = document.getElementById(navId);
  if (el) el.classList.add('active');
  var frame = document.getElementById('content-frame');
  if (frame) frame.src = '/' + page + (page.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
}

(async function () {
  try {
    var res = await fetch('/api/check-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Cercle-Token': token },
      body: '{}'
    });
    var data = await res.json();
    if (!data.valid) { logout(); return; }
    if (data.role !== 'admin' && data.role !== 'super_admin') {
      location.href = '/dashboard.html';
      return;
    }
    if (data.firstName) document.getElementById('prenom').textContent = data.firstName;
  } catch (e) {
    logout();
  }
})();
</script>
</body>
</html>
