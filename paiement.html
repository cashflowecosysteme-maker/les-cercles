<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiements — Le Cercle</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--t4:#4a5278;--green:#00E676;--gold:#F4C842;--pink:#E040FB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg1);color:var(--t2);padding:28px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:24px;color:#fff;margin-bottom:4px}
.sub{color:var(--t3);font-size:13px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 12px;text-align:center}
.stat .ico{font-size:18px;margin-bottom:6px}
.stat b{display:block;font-size:22px;color:#fff;font-family:'Space Grotesk',sans-serif}
.stat.money b{color:var(--green)}.stat.pending b{color:var(--gold)}.stat.paid b{color:var(--pink)}
.stat span{font-size:12px;color:var(--t3)}
.empty{text-align:center;color:var(--t3);padding:40px 12px;font-size:14px}
.empty small{display:block;margin-top:6px;font-size:12px;color:var(--t4)}
.lien-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lien-box .meta{flex:1;min-width:0}.lien-box .lbl{font-size:12px;color:var(--t3);margin-bottom:4px}
.lien-box code{font-size:13px;color:#fff;word-break:break-all}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif;white-space:nowrap}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.25);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select{padding:12px 14px;border-radius:12px;border:1px solid rgba(123,92,255,.2);background:rgba(15,28,63,.5);color:#fff;font-family:Outfit,sans-serif;font-size:13px;outline:none}
.search{border-radius:50px;max-width:280px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.mkt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:700px){.mkt-stats{grid-template-columns:1fr 1fr}}
.chip{padding:6px 12px;border-radius:50px;border:1px solid rgba(123,92,255,.2);background:transparent;color:var(--t3);font-size:12px;cursor:pointer}
.chip.active{background:rgba(123,92,255,.2);color:#fff}
</style>
<script>
var TOKEN=sessionStorage.getItem('nyxia_token')||'';
async function api(p,m,b){var o={method:m||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':TOKEN}};if(b)o.body=JSON.stringify(b);var r=await fetch(p,o);return r.json().catch(function(){return{}})}
function money(n){return Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $'}
</script>
</head><body>

<div style="max-width:1100px;margin:0 auto">
  <div class="card">
    <div style="font-weight:600;color:#fff;margin-bottom:4px">⏱ Paiements en attente</div>
    <p class="sub">Payez vos membres pour leurs commissions</p>
    <div class="empty">Aucun paiement en attente</div>
  </div>
  <div style="text-align:center;color:var(--t4);font-size:12px;margin:12px 0">Historique</div>
  <div class="card">
    <div style="font-weight:600;color:#fff;margin-bottom:4px">Historique des paiements</div>
    <p class="sub">Vos paiements déjà effectués</p>
    <div class="empty">Aucun paiement effectué<small>Les paiements traités apparaîtront ici</small></div>
  </div>
</div>
</body></html>
