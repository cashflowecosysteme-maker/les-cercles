<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><link rel="icon" href="/FavIcon.png"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#0A1628;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:transparent;color:var(--t2);padding:24px;min-height:100%}
.page-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--t3);margin-bottom:24px}
.panel{background:rgba(26,37,84,0.55);border:1px solid rgba(123,92,255,0.2);border-radius:16px;padding:20px;margin-bottom:16px;max-width:720px}
.panel h2{font-size:15px;color:#fff;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;margin-bottom:12px;border:1px solid rgba(123,92,255,0.25);background:rgba(15,28,63,0.7);color:#fff;font-family:inherit;font-size:14px}
.btn{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-ghost{background:rgba(123,92,255,0.1);border:1px solid rgba(123,92,255,0.3);color:var(--p3)}
.btn-danger{background:rgba(255,75,110,0.12);border:1px solid rgba(255,75,110,0.3);color:var(--red)}
.msg{margin-top:10px;font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;padding:8px 6px}
td{padding:12px 6px;border-top:1px solid rgba(123,92,255,0.1)}
.empty{color:var(--t3);font-size:14px;padding:12px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.msg-item{padding:14px;border-radius:14px;border:1px solid rgba(123,92,255,0.2);background:rgba(26,37,84,0.55);margin-bottom:10px}
.msg-item.mine{border-color:rgba(123,92,255,0.4);background:rgba(123,92,255,0.12)}
.msg-meta{font-size:11px;color:var(--t3);margin-bottom:6px}
</style></head>
<body>
<div class="page-title">Messages</div>
<p class="page-sub">Écris au SuperAdmin ou aux membres de ton cercle.</p>
<div class="panel">
  <h2>Nouveau message</h2>
  <label>Destinataire</label>
  <select id="destinataire"><option value="">Chargement…</option></select>
  <label>Sujet</label>
  <input id="sujet" value="Concernant mon cercle">
  <label>Message</label>
  <textarea id="contenu" rows="4" placeholder="Ton message…"></textarea>
  <button class="btn" type="button" onclick="sendMsg()">Envoyer</button>
  <div class="msg" id="send-msg"></div>
</div>
<div class="panel">
  <h2>Fil de discussion</h2>
  <div id="thread" class="empty">Chargement…</div>
</div>
<script>

var TOKEN_KEY='nyxia_cercle_token';
var token=sessionStorage.getItem(TOKEN_KEY);
if(!token){ parent.location.href='/login.html'; }
async function api(path,method,body){
  var o={method:method||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':token}};
  if(body) o.body=JSON.stringify(body);
  var r=await fetch(path,o);
  var d=await r.json();
  if(r.status===401){ parent.location.href='/login.html'; throw new Error('Session'); }
  return d;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}

async function loadContacts(){
  var sel=document.getElementById('destinataire');
  try{
    var d=await api('/api/messages/contacts','GET');
    var list=d.contacts||[];
    if(!list.length){
      sel.innerHTML='<option value="superadmin">SuperAdmin</option>';
      return;
    }
    sel.innerHTML=list.map(function(c){
      var label=(c.role==='super_admin'?'SuperAdmin — ':'Cercle — ')+esc(c.prenom)+' ('+esc(c.email)+')';
      return '<option value="'+esc(c.id)+'">'+label+'</option>';
    }).join('');
  }catch(e){
    sel.innerHTML='<option value="superadmin">SuperAdmin</option>';
  }
}
async function loadThread(){
  try{
    var d=await api('/api/messages','GET');
    var list=d.messages||[];
    var el=document.getElementById('thread');
    if(!list.length){ el.innerHTML='<p class="empty">Aucun message pour le moment.</p>'; return; }
    el.innerHTML=list.map(function(m){
      var cls=m.deMoi?'msg-item mine':'msg-item';
      var who=m.deMoi?'Toi →':'→ Toi';
      return '<div class="'+cls+'"><div class="msg-meta">'+who+' · '+esc((m.date||'').slice(0,16))+'</div>'
        +(m.sujet?'<div style="font-weight:600;color:#fff;margin-bottom:4px">'+esc(m.sujet)+'</div>':'')
        +'<div style="white-space:pre-wrap">'+esc(m.contenu)+'</div></div>';
    }).join('');
  }catch(e){ document.getElementById('thread').innerHTML='<p class="err">Impossible de charger.</p>'; }
}
async function sendMsg(){
  var to=document.getElementById('destinataire').value;
  var sujet=document.getElementById('sujet').value.trim();
  var contenu=document.getElementById('contenu').value.trim();
  var box=document.getElementById('send-msg');
  if(!contenu){ box.className='msg err'; box.textContent='Écris un message.'; return; }
  if(!to){ box.className='msg err'; box.textContent='Choisis un destinataire.'; return; }
  try{
    var d=await api('/api/messages','POST',{sujet:sujet,contenu:contenu,recipientId:to});
    if(d.success){
      box.className='msg ok'; box.textContent='Message envoyé.';
      document.getElementById('contenu').value='';
      loadThread();
    } else {
      box.className='msg err'; box.textContent=d.error||'Erreur d\'envoi';
    }
  }catch(e){ box.className='msg err'; box.textContent=e.message||'Erreur réseau'; }
}
loadContacts(); loadThread();
</script>
</body></html>
