<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Cercles · Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1:#0F1C3F; --bg2:#1A2554; --p:#7B5CFF; --p2:#5A6CFF; --p3:#4FA3FF;
  --t:#fff; --t2:#D6D9F0; --t3:#8891B8; --red:#ff6b6b; --green:#00E676;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;
  font-family:'Outfit',sans-serif;background:var(--bg1);color:var(--t2);
  background-image:
    radial-gradient(ellipse 60% 50% at 30% 20%, rgba(123,92,255,.15), transparent 65%),
    radial-gradient(ellipse 50% 40% at 70% 80%, rgba(79,163,255,.08), transparent 60%);
}
.card{position:relative;z-index:1;
  width:100%;max-width:400px;margin:20px;padding:36px 32px;
  background:rgba(26,37,84,.7);border:1px solid rgba(123,92,255,.25);
  border-radius:20px;backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;text-align:center;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:var(--t3);margin-bottom:28px}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
input{
  width:100%;padding:13px 14px;border-radius:11px;margin-bottom:16px;
  border:1px solid rgba(123,92,255,.25);background:rgba(15,28,63,.75);
  color:var(--t);font-size:15px;outline:none;font-family:inherit;
}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(123,92,255,.15)}
button{
  width:100%;padding:14px;border:none;border-radius:11px;margin-top:4px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}
.msg.error{display:block;background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.25)}
.msg.ok{display:block;background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.25)}

canvas#starry-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="card">
  <h1>Les Cercles</h1>
  <p class="sub">Espace d’entraide et de partage</p>
  <label>Courriel</label>
  <input type="email" id="email" autocomplete="username" placeholder="ton@courriel.com">
  <label>Mot de passe</label>
  <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
  <button id="btn" onclick="doLogin()">Entrer</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var TOKEN_KEY = 'nyxia_cercle_token';
(function(){
  var t = sessionStorage.getItem(TOKEN_KEY);
  if(!t) return;
  fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json','X-Cercle-Token':t},body:'{}'})
    .then(function(r){return r.json()})
    .then(function(d){ if(d.valid) location.href='/dashboard.html'; })
    .catch(function(){});
})();
function show(text, type){
  var el=document.getElementById('msg');
  el.textContent=text; el.className='msg '+type;
}
async function doLogin(){
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  var btn=document.getElementById('btn');
  if(!email||!password){ show('Remplis les deux champs.','error'); return; }
  btn.disabled=true; btn.textContent='Connexion…';
  try{
    var res=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:password})
    });
    var data=await res.json();
    if(data.success && data.token){
      sessionStorage.setItem(TOKEN_KEY, data.token);
      if(data.firstName) localStorage.setItem('nyxia_cercle_prenom', data.firstName);
      location.href='/dashboard.html';
    } else {
      show(data.error||'Identifiants incorrects.','error');
    }
  }catch(e){
    show('Impossible de joindre le serveur.','error');
  }
  btn.disabled=false; btn.textContent='Entrer';
}
document.getElementById('password').addEventListener('keydown',function(e){
  if(e.key==='Enter') doLogin();
});
</script>
<script src="/starry-bg.js" defer></script>
</body>
</html>
