<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/FavIcon.png">
<title>Produits — Le Cercle</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0A1628;--bg2:#0F1C3F;--bg3:#1A2554;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--t4:#4a5278;--green:#00E676;--gold:#F4C842}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg1);color:var(--t2);font-family:Outfit,sans-serif}
body{padding:28px;overflow-y:auto}
h2{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;margin-bottom:6px}
.sub{color:var(--t3);font-size:13px;margin-bottom:24px;line-height:1.5}
.card{background:rgba(123,92,255,0.06);border:1px solid rgba(123,92,255,0.15);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(123,92,255,0.2);background:rgba(15,28,63,0.5);color:#fff;font-family:Outfit,sans-serif;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.btn{padding:12px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.btn:hover{opacity:.92}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.3);color:var(--p3)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--t3);margin-top:8px}
.msg{margin-top:12px;font-size:13px;display:none}.msg.ok{display:block;color:var(--green)}.msg.err{display:block;color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;padding:8px 6px}
td{padding:10px 6px;border-top:1px solid rgba(123,92,255,.1);color:var(--t2)}
td strong{color:#fff}
</style>

<script>
var TOKEN = sessionStorage.getItem('nyxia_token') || '';
async function api(path, method, body) {
  var opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'X-Cercle-Token': TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  var r = await fetch(path, opts);
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || ('Erreur ' + r.status));
  return data;
}
function showMsg(id, text, ok) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
</script>
</head>
<body>

<div style="max-width:900px;margin:0 auto">
  <h2>📦 Créer et gérer tes produits</h2>
  <p class="sub">Ajoute tes propres offres ou gère celles déjà publiées.</p>
  <div class="card">
    <div style="font-weight:600;margin-bottom:14px;color:#fff">+ Nouveau produit</div>
    <div class="grid2">
      <div><label>Titre *</label><input id="prod-title"></div>
      <div><label>Prix</label><input id="prod-price" type="number" step="0.01"></div>
      <div style="grid-column:1/-1"><label>Description courte</label><input id="prod-desc"></div>
      <div><label>Lien d’offre</label><input id="prod-link" placeholder="https://..."></div>
      <div><label>Image (URL)</label><input id="prod-img"></div>
      <div><label>Statut</label>
        <select id="prod-status">
          <option value="draft">Brouillon</option>
          <option value="active">Publié</option>
        </select>
      </div>
      <div><label>Code promo</label><input id="prod-promo" placeholder="ex: NYXIA25"></div>
    </div>
    <button class="btn" style="margin-top:14px" onclick="createProduct()">Publier / Enregistrer</button>
    <div class="msg" id="prod-msg"></div>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:10px;color:#fff">Mes produits</div>
    <div id="prod-list" class="hint">Chargement…</div>
  </div>
</div>
<script>
async function createProduct(){
  try {
    var body = {
      title: document.getElementById('prod-title').value.trim(),
      description: document.getElementById('prod-desc').value.trim(),
      price: document.getElementById('prod-price').value,
      affiliateLink: document.getElementById('prod-link').value.trim(),
      imageUrl: document.getElementById('prod-img').value.trim(),
      status: document.getElementById('prod-status').value
    };
    var out = await api('/api/products','POST',body);
    showMsg('prod-msg', out.success ? 'Produit enregistré.' : (out.error||'Erreur'), !!out.success);
    if (out.success) loadProducts();
  } catch(e){ showMsg('prod-msg', e.message, false); }
}
async function loadProducts(){
  var box = document.getElementById('prod-list');
  try {
    var out = await api('/api/products','GET');
    var list = out.products || [];
    if (!list.length) { box.textContent = 'Aucun produit pour le moment.'; return; }
    box.innerHTML = '<table><tr><th>Titre</th><th>Prix</th><th>Statut</th></tr>' +
      list.map(function(p){
        return '<tr><td><strong>'+(p.title||'')+'</strong></td><td>'+(p.price||0)+' $</td><td>'+(p.status||'')+'</td></tr>';
      }).join('') + '</table>';
  } catch(e){ box.textContent = e.message; }
}
loadProducts();
</script>

</body>
</html>
