<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Cercles · Espace Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0F1C3F;--bg2:#1A2554;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--red:#FF4B6E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg1);color:var(--t2);min-height:100vh}
canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.header,.main{position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(123,92,255,.15);background:rgba(15,28,63,.9)}
.header h1{font-family:Space Grotesk,sans-serif;font-size:18px;color:#fff}
.btn{padding:10px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.btn-out{background:rgba(255,75,110,.12);border:1px solid rgba(255,75,110,.3);color:var(--red)}
.main{max-width:900px;margin:0 auto;padding:20px}
.panel{background:rgba(26,37,84,.55);border:1px solid rgba(123,92,255,.2);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;color:#fff;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(123,92,255,.25);background:rgba(15,28,63,.7);color:#fff;font-family:inherit}
.msg{margin-top:10px;font-size:13px}
.ok{color:var(--green)}.err{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 6px;border-top:1px solid rgba(123,92,255,.1);text-align:left}
th{color:var(--t3);font-size:11px;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="header">
  <div><h1>Espace Admin</h1><div id="hello" style="font-size:13px;color:var(--t3)">—</div></div>
  <div style="display:flex;gap:8px">
    <a class="btn" href="/dashboard.html" style="text-decoration:none">Mon cercle</a>
    <button class="btn btn-out" onclick="logout()">Déconnexion</button>
  </div>
</div>
<div class="main">
  <div class="panel">
    <h2>PayPal (pour recevoir et payer ton cercle)</h2>
    <div class="grid">
      <div><label>Email PayPal</label><input id="paypal" placeholder="ton@paypal.com"></div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="savePaypal()">Enregistrer PayPal</button>
    <div class="msg" id="pp-msg"></div>
  </div>
  <div class="panel">
    <h2>Créer un produit → visible sur le Répertoire</h2>
    <div class="grid">
      <div><label>Titre *</label><input id="title"></div>
      <div><label>Prix</label><input id="price" type="number" step="0.01"></div>
      <div style="grid-column:1/-1"><label>Description</label><input id="desc"></div>
      <div><label>Lien d’offre</label><input id="link" placeholder="https://..."></div>
      <div><label>Image (URL)</label><input id="img"></div>
    </div>
    <button class="btn" style="margin-top:12px" onclick="createProduct()">Publier</button>
    <div class="msg" id="pr-msg"></div>
  </div>
  <div class="panel">
    <h2>Mes produits</h2>
    <div id="list">Chargement…</div>
  </div>
</div>
<script src="/starry-bg.js" defer></script>
<script>
var TOKEN_KEY='nyxia_cercle_token';
var token=sessionStorage.getItem(TOKEN_KEY);
if(!token) location.href='/login.html';
function logout(){sessionStorage.removeItem(TOKEN_KEY);location.href='/login.html';}
async function api(path,method,body){
  var o={method:method||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':token}};
  if(body)o.body=JSON.stringify(body);
  var r=await fetch(path,o);var d=await r.json();
  if(r.status===401){logout();throw new Error('Session');}
  return d;
}
(async function init(){
  var auth=await api('/api/check-auth','POST',{});
  if(!auth.valid){logout();return;}
  if(auth.role!=='admin'&&auth.role!=='super_admin'){location.href='/dashboard.html';return;}
  document.getElementById('hello').textContent='Bonjour '+(auth.firstName||'');
  var dash=await api('/api/dashboard','POST',{});
  if(dash.profil) document.getElementById('paypal').value=dash.profil.paypal||'';
  loadProducts();
})();
async function savePaypal(){
  var d=await api('/api/paypal','POST',{paypal:document.getElementById('paypal').value.trim()});
  document.getElementById('pp-msg').className='msg '+(d.success?'ok':'err');
  document.getElementById('pp-msg').textContent=d.success?'Enregistré.':(d.error||'Erreur');
}
async function createProduct(){
  var d=await api('/api/admin/products','POST',{title:document.getElementById('title').value.trim(),description:document.getElementById('desc').value.trim(),price:document.getElementById('price').value,affiliateLink:document.getElementById('link').value.trim(),imageUrl:document.getElementById('img').value.trim()});
  document.getElementById('pr-msg').className='msg '+(d.success?'ok':'err');
  document.getElementById('pr-msg').textContent=d.success?'Produit publié sur le Répertoire.':(d.error||'Erreur');
  if(d.success)loadProducts();
}
async function loadProducts(){
  var d=await api('/api/admin/products','GET');
  var list=d.products||[];
  var el=document.getElementById('list');
  if(!list.length){el.textContent='Aucun produit pour le moment.';return;}
  el.innerHTML='<table><tr><th>Titre</th><th>Prix</th><th>Statut</th></tr>'+list.map(function(p){
    return '<tr><td>'+p.title+'</td><td>'+p.price+'</td><td>'+p.status+'</td></tr>';
  }).join('')+'</table>';
}
</script>
</body>
</html>
