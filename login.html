<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Cercles — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0F1C3F;
      --bg2: #1A2554;
      --bg3: #2A3A6E;
      --p:   #7B5CFF;
      --p2:  #5A6CFF;
      --p3:  #4FA3FF;
      --glow: rgba(123,92,255,0.4);
      --t:   #FFFFFF;
      --t2:  #D6D9F0;
      --t3:  #8891B8;
      --green: #00E676;
      --red: #FF4B6E;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg1);
      color: var(--t2);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas#starry-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 20%, rgba(123,92,255,0.15) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 70% 80%, rgba(79,163,255,0.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .login-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; padding: 24px;
    }
    .login-card {
      background: rgba(26,37,84,0.55);
      border: 1px solid rgba(123,92,255,0.2);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4), 0 0 60px rgba(123,92,255,0.08);
      animation: cardIn .5s ease;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(24px) scale(.97); }
      to   { opacity:1; transform:none; }
    }
    .login-header { text-align: center; margin-bottom: 36px; }
    .login-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(123,92,255,0.45);
      box-shadow: 0 0 30px rgba(123,92,255,0.35);
      margin-bottom: 14px;
    }
    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px;
    }
    .login-subtitle { font-size: 14px; color: var(--t3); line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--t3); margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(123,92,255,0.25);
      background: rgba(15,28,63,0.7);
      color: var(--t); font-size: 15px; font-family: inherit; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus {
      border-color: var(--p);
      box-shadow: 0 0 0 3px rgba(123,92,255,0.15);
    }
    .form-input::placeholder { color: rgba(136,145,184,0.5); }
    .input-wrap { position: relative; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; opacity: .7;
    }
    .btn-login {
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--p), var(--p2));
      color: #fff; font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 8px; transition: transform .15s, box-shadow .15s;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(123,92,255,0.35); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg-box {
      margin-top: 16px; padding: 12px 14px; border-radius: 10px;
      font-size: 13px; display: none; text-align: center;
    }
    .msg-box.error {
      display: block; background: rgba(255,75,110,0.12);
      color: var(--red); border: 1px solid rgba(255,75,110,0.25);
    }
    .msg-box.success {
      display: block; background: rgba(0,230,118,0.1);
      color: var(--green); border: 1px solid rgba(0,230,118,0.25);
    }
    .login-footer {
      margin-top: 28px; text-align: center; font-size: 12px; color: var(--t3); line-height: 1.7;
    }
    .login-footer a { color: var(--p3); text-decoration: none; }
  </style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <img src="/NyXia.png" alt="NyXia" class="login-avatar">
      <div class="login-title">Les Cercles</div>
      <div class="login-subtitle">Connecte-toi pour accéder à ton espace d’entraide et de partage</div>
    </div>
    <form id="login-form" onsubmit="return false">
      <div class="form-group">
        <label class="form-label" for="firstname">Ton prénom</label>
        <input class="form-input" type="text" id="firstname" placeholder="Ex : Sophie, Marc, Alex…" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Adresse email</label>
        <input class="form-input" type="email" id="email" placeholder="ton@email.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:44px">
          <button type="button" class="toggle-pw" id="toggle-pw" onclick="togglePw()" title="Afficher/masquer">👁</button>
        </div>
      </div>
      <button class="btn-login" id="btn-login" onclick="doLogin()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Se connecter</span>
      </button>
      <div class="msg-box" id="msg-box"></div>
    </form>
    <div class="login-footer">
      Espace réservé aux membres des Cercles NyXia<br>
      <span style="opacity:0.5">© NyXia</span>
    </div>
  </div>
</div>
<script src="/starry-bg.js" defer></script>
<script>
var TOKEN_KEY = 'nyxia_cercle_token';
;(function() {
  var token = sessionStorage.getItem(TOKEN_KEY);
  if (!token) return;
  fetch('/api/check-auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Cercle-Token': token },
    body: '{}'
  }).then(function(r) { return r.json(); })
    .then(function(data) { if (data.valid) location.href = '/dashboard.html'; })
    .catch(function() {});
})();

function togglePw() {
  var input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function showMsg(text, type) {
  var el = document.getElementById('msg-box');
  el.textContent = text;
  el.className = 'msg-box ' + type;
}

function doLogin() {
  var firstname = document.getElementById('firstname').value.trim();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var btn = document.getElementById('btn-login');
  var spinner = document.getElementById('spinner');
  var btnText = document.getElementById('btn-text');

  if (!email || !password) {
    showMsg('Remplis ton email et ton mot de passe.', 'error');
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Connexion…';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(r) { return r.json().then(function(d) { d.__ok = r.ok; return d; }); })
  .then(function(data) {
    if (data.success && data.token) {
      sessionStorage.setItem(TOKEN_KEY, data.token);
      var name = firstname || data.firstName || '';
      if (name) {
        name = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
        localStorage.setItem('nyxia_cercle_prenom', name);
      }
      location.href = '/dashboard.html';
    } else {
      showMsg(data.error || 'Identifiants incorrects.', 'error');
    }
  })
  .catch(function() {
    showMsg('Impossible de joindre le serveur. Réessaie dans un instant.', 'error');
  })
  .finally(function() {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Se connecter';
  });
}

document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
