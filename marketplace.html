<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — Le Cercle</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--t4:#4a5278;--green:#00E676;--gold:#F4C842}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg1);color:var(--t2);padding:28px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;margin-bottom:4px}
.sub{color:var(--t3);font-size:13px;margin-bottom:16px}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.25);color:#fff}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(123,92,255,.2);background:rgba(15,28,63,.5);color:#fff;font-family:Outfit,sans-serif;font-size:13px;outline:none;margin-bottom:10px}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.mkt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:700px){.mkt-stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat span{font-size:12px;color:var(--t3)}.stat b{display:block;font-size:20px;color:#fff;margin-top:4px}
.chip{padding:6px 12px;border-radius:50px;border:1px solid rgba(123,92,255,.2);background:transparent;color:var(--t3);font-size:12px;cursor:pointer}
.chip.active{background:rgba(123,92,255,.2);color:#fff}
.empty{text-align:center;color:var(--t3);padding:36px 12px;font-size:14px}
.empty small{display:block;margin-top:6px;font-size:12px;color:var(--t4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;padding:8px 6px}
td{padding:12px 6px;border-top:1px solid rgba(123,92,255,.1);color:var(--t2)}
td strong{color:#fff}
#form-wrap{display:none}
.msg{font-size:13px;margin-top:8px;display:none}.msg.ok{display:block;color:var(--green)}.msg.err{display:block;color:#ff6b6b}
</style>
<script>
var TOKEN = sessionStorage.getItem('nyxia_token') || '';
var ALL = [];
var FILTER = 'all';
async function api(path, method, body) {
  var opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'X-Cercle-Token': TOKEN } };
  if (body) opts.body = JSON.stringify(Object.assign({ token: TOKEN }, body || {}));
  var r = await fetch(path, opts);
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || ('Erreur ' + r.status));
  return data;
}
function formatTarif(p){
  var bt = p.billing_type || 'one_time';
  var u = money(p.price);
  var m = money(p.price_monthly);
  if (bt === 'subscription') return m + '/mois';
  if (bt === 'both') return u + ' + ' + m + '/mois';
  return u;
}
function money(n){ return Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $'; }
</script>
</head>
<body>
<div style="max-width:1100px;margin:0 auto">
  <div class="top-row">
    <div>
      <h1>Marketplace</h1>
      <p class="sub">Vos produits uniquement. Toute création part en <strong>brouillon</strong> jusqu’à validation par le Super Admin.</p>
    </div>
    <button type="button" class="btn" onclick="toggleForm(true)">+ Ajouter un produit</button>
  </div>

  <div class="card" id="form-wrap">
    <div style="font-weight:600;color:#fff;margin-bottom:12px">Nouveau produit</div>
    <div class="grid2">
      <div><label>Titre *</label><input id="p-title"></div>
      <div><label>Type de tarif</label>
        <select id="p-billing">
          <option value="one_time">Paiement unique</option>
          <option value="subscription">Abonnement mensuel</option>
          <option value="both">Unique + abonnement mensuel</option>
        </select>
      </div>
      <div><label>Prix unique ($)</label><input id="p-price" type="number" step="0.01" value="0" placeholder="0 si abo seulement"></div>
      <div><label>Abonnement mensuel ($)</label><input id="p-price-month" type="number" step="0.01" value="0" placeholder="0 si pas d’abo"></div>
      <div style="grid-column:1/-1"><label>Description courte</label><input id="p-desc"></div>
      <div><label>Image (URL)</label><input id="p-img" placeholder="https://…"></div>
      <div><label>Lien d’offre / page de vente</label><input id="p-link" placeholder="https://…"></div>
      <div><label>Code promo (optionnel)</label><input id="p-promo"></div>
      <div style="grid-column:1/-1"><label>Guide de promotion (publications, angles, quoi dire…)</label>
        <textarea id="p-promo-guide" rows="4" placeholder="Ex. : publication prête, message type, où partager…" style="width:100%;border-radius:12px;padding:10px;background:rgba(6,10,24,.5);border:1px solid var(--border);color:#fff;font-family:Outfit,sans-serif"></textarea>
      </div>
      <div><label>Rejoindre le cercle — type</label>
        <select id="p-join-type">
          <option value="free">Gratuit</option>
          <option value="paid">Payant</option>
        </select>
      </div>
      <div style="grid-column:1/-1"><label>Lien « Rejoindre le cercle »</label>
        <input id="p-join-url" placeholder="Laissé vide = généré auto (répertoire + ton code parrain)">
        <div style="font-size:11px;color:var(--t3);margin-top:4px">Automatique si vide : https://repertoire.nyxia.top/?product=…&amp;ref=TON_CODE</div>
      </div>
      <div><label>Statut</label>
        <select id="p-status" disabled title="Publication réservée au Super Admin">
          <option value="draft" selected>Brouillon — en attente Super Admin</option>
        </select>
      </div>
      <div><label>Commission N1 %</label><input id="p-c1" type="number" step="0.01" placeholder="ex: 25"></div>
      <div><label>Commission N2 %</label><input id="p-c2" type="number" step="0.01" placeholder="ex: 10"></div>
      <div><label>Commission N3 %</label><input id="p-c3" type="number" step="0.01" placeholder="ex: 5"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn" onclick="saveProduct()">Enregistrer</button>
      <button type="button" class="btn btn-ghost" onclick="toggleForm(false)">Annuler</button>
    </div>
    <div id="form-msg" class="msg"></div>
  </div>

  <div class="row">
    <input type="search" id="q" placeholder="Rechercher un produit…" style="flex:1;min-width:180px;border-radius:50px;margin:0" oninput="render()">
    <button type="button" class="chip active" data-f="all" onclick="setFilter('all',this)">Tous</button>
    <button type="button" class="chip" data-f="active" onclick="setFilter('active',this)">Actifs</button>
    <button type="button" class="chip" data-f="draft" onclick="setFilter('draft',this)">Brouillons</button>
    <button type="button" class="chip" data-f="archived" onclick="setFilter('archived',this)">Archivés</button>
  </div>

  <div class="mkt-stats">
    <div class="stat"><span>Total produits</span><b id="st-total">0</b></div>
    <div class="stat"><span>Publiés</span><b id="st-pub" style="color:var(--green)">0</b></div>
    <div class="stat"><span>Brouillons</span><b id="st-draft" style="color:var(--gold)">0</b></div>
    <div class="stat"><span>Vues totales</span><b id="st-views">0</b></div>
  </div>

  <div class="card">
    <div id="list" class="empty">Chargement…</div>
  </div>
</div>
<script>
function toggleForm(show) {
  document.getElementById('form-wrap').style.display = show ? 'block' : 'none';
  if (show) document.getElementById('form-msg').className = 'msg';
}
function setFilter(f, el) {
  FILTER = f;
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  if (el) el.classList.add('active');
  render();
}
async function saveProduct() {
  var title = document.getElementById('p-title').value.trim();
  var msg = document.getElementById('form-msg');
  if (!title) { msg.textContent = 'Titre requis.'; msg.className = 'msg err'; return; }
  try {
    var out = await api('/api/products', 'POST', {
      title: title,
      description: document.getElementById('p-desc').value.trim(),
      price: document.getElementById('p-price').value,
      price_monthly: document.getElementById('p-price-month').value,
      billing_type: document.getElementById('p-billing').value,
      imageUrl: document.getElementById('p-img').value.trim(),
      affiliateLink: document.getElementById('p-link').value.trim(),
      promoCode: document.getElementById('p-promo').value.trim(),
      promo_guide: document.getElementById('p-promo-guide').value.trim(),
      join_type: document.getElementById('p-join-type').value,
      join_url: document.getElementById('p-join-url').value.trim(),
      status: document.getElementById('p-status').value,
      commission_n1: document.getElementById('p-c1').value || null,
      commission_n2: document.getElementById('p-c2').value || null,
      commission_n3: document.getElementById('p-c3').value || null
    });
    msg.textContent = 'Produit enregistré.';
    msg.className = 'msg ok';
    document.getElementById('p-title').value = '';
    document.getElementById('p-desc').value = '';
    await load();
    setTimeout(function(){ toggleForm(false); }, 800);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg err';
  }
}
function render() {
  var q = (document.getElementById('q').value || '').toLowerCase();
  var list = ALL.filter(function(p){
    if (FILTER === 'active' && p.status !== 'active' && p.status !== 'published') return false;
    if (FILTER === 'draft' && p.status !== 'draft') return false;
    if (FILTER === 'archived' && p.status !== 'archived') return false;
    if (q && String(p.title||'').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var box = document.getElementById('list');
  if (!list.length) {
    box.className = 'empty';
    box.innerHTML = 'Aucun produit<small>Cliquez sur « Ajouter un produit » pour publier sur le Marketplace</small>';
    return;
  }
  box.className = '';
  box.innerHTML = '<table><tr><th>Titre</th><th>Prix</th><th>Statut</th><th>Promo</th><th>Actions</th></tr>' +
    list.map(function(p){
      var id = String(p.id||'');
      var st = p.status || '';
      var sid = p.seller_id;
      var isSA = (sid == null || sid === '' || sid === 'superadmin' || sid === 'SUPERADMIN');
      var actions;
      if (isSA) {
        actions = '<span style="font-size:11px;color:var(--t3)">Super Admin — lecture seule</span>';
      } else {
        var btnDraft = (st === 'active' || st === 'published')
          ? '<button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="setStatus(\''+id+'\',\'draft\')">Brouillon</button>'
          : '<button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="setStatus(\''+id+'\',\'active\')">Publier</button>';
        var btnDel = '<button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:12px;color:#ff8fab;border-color:rgba(255,75,110,.3)" onclick="deleteProduct(\''+id+'\')">Supprimer</button>';
        actions = btnDraft + ' ' + btnDel;
      }
      return '<tr><td><strong>'+(p.title||'')+'</strong></td><td>'+formatTarif(p)+'</td><td>'+st+'</td><td>'+(p.promo_code||'—')+'</td><td style="white-space:nowrap">'+actions+'</td></tr>';
    }).join('') + '</table>';
}
async function setStatus(id, status) {
  try {
    await api('/api/products/update', 'POST', { id: id, status: status });
    await load();
  } catch (e) { alert(e.message || e); }
}
async function deleteProduct(id) {
  if (!confirm('Supprimer ce produit ?')) return;
  try {
    await api('/api/products/delete', 'POST', { id: id });
    await load();
  } catch (e) { alert(e.message || e); }
}
async function load() {
  try {
    var out = await api('/api/products', 'GET');
    ALL = out.products || [];
  } catch (e) {
    ALL = [];
    document.getElementById('list').className = 'empty';
    document.getElementById('list').textContent = 'Impossible de charger : ' + e.message;
    return;
  }
  var pub = ALL.filter(function(p){ return p.status==='active'||p.status==='published'; }).length;
  var draft = ALL.filter(function(p){ return p.status==='draft'; }).length;
  document.getElementById('st-total').textContent = ALL.length;
  document.getElementById('st-pub').textContent = pub;
  document.getElementById('st-draft').textContent = draft;
  try {
    var st = await api('/api/stats', 'POST', { token: TOKEN });
    if (st && st.clicks != null) document.getElementById('st-views').textContent = st.clicks;
    else document.getElementById('st-views').textContent = '0';
  } catch (e) { document.getElementById('st-views').textContent = '0'; }
  render();
}
load();
</script>
</body>
</html>
